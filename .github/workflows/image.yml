name: Image

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: ${{ matrix.board }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        board: [pi4, pi5]
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          add-channel: "true"
          extra-conf: |
            accept-flake-config = true
            # Prevent out-of-memory SIGTERM
            max-jobs = 1

      - name: Install attic
        run: nix profile install nixpkgs#attic-client

      - name: Configure the cache
        id: cache
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if [ -z "$ATTIC_TOKEN" ]; then
            echo "::notice::ATTIC_TOKEN is not set, building without the binary cache"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          token_file="$RUNNER_TEMP/attic-token"
          printf '%s\n' "$ATTIC_TOKEN" > "$token_file"
          chmod 600 "$token_file"

          mkdir -p ~/.config/attic
          cat > ~/.config/attic/config.toml <<EOF
          default-server = "attic"

          [servers.attic]
          endpoint = "https://attic.eric.dev.br/"
          token-file = "$token_file"
          EOF
          chmod 600 ~/.config/attic/config.toml

          attic use attic:blueos

          if ! nix config show | grep -q 'attic.eric.dev.br'; then
            echo "the cache was not registered as a substituter" >&2
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # The kernel is most of the build time, so it is built and pushed before
      # the rest of the system: a run that dies later still leaves it cached
      # for the next one.
      - name: Build the kernel
        run: |
          nix build --no-link --print-out-paths \
            .#nixosConfigurations.blueos-${{ matrix.board }}.config.boot.kernelPackages.kernel \
            .#nixosConfigurations.blueos-${{ matrix.board }}.config.boot.kernelPackages.kernel.modules \
            > "$RUNNER_TEMP/kernel"

      - name: Push the kernel to the cache
        if: steps.cache.outputs.enabled == 'true' && github.event_name != 'pull_request'
        run: xargs attic push attic:blueos < "$RUNNER_TEMP/kernel"

      - name: Build the system
        run: |
          nix build --no-link --print-out-paths \
            .#nixosConfigurations.blueos-${{ matrix.board }}.config.system.build.toplevel \
            > "$RUNNER_TEMP/toplevel"

      - name: Push the system to the cache
        if: steps.cache.outputs.enabled == 'true' && github.event_name != 'pull_request'
        run: attic push attic:blueos "$(cat "$RUNNER_TEMP/toplevel")"

      - name: Build the image
        run: |
          nix build .#nixosConfigurations.blueos-${{ matrix.board }}.config.system.build.sdImage \
            --out-link image

      - uses: actions/upload-artifact@v7
        with:
          name: blueos-${{ matrix.board }}
          path: image/sd-image/*.img.zst
          if-no-files-found: error
          retention-days: 7

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: image/sd-image/*.img.zst
