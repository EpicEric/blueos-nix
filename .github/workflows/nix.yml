name: Build images with Nix

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Cache the RPi image (${{ matrix.board }})
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        board: [pi4, pi5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          add-channel: "true"
          extra-conf: |
            accept-flake-config = true
            extra-substituters = ${{ vars.NIKS3_SERVER_URL }}
            extra-trusted-public-keys = ${{ vars.NIKS3_PUBLIC_KEY }}
            # Prevent out-of-memory SIGTERM
            max-jobs = 1

      - name: Install niks3
        run: nix profile install nixpkgs#niks3

      - name: Build the kernel
        run: |
          nix build --no-link --print-out-paths \
            .#nixosConfigurations.blueos-${{ matrix.board }}.config.boot.kernelPackages.kernel \
            .#nixosConfigurations.blueos-${{ matrix.board }}.config.boot.kernelPackages.kernel.modules \
            > "$RUNNER_TEMP/kernel"

      - name: Push the kernel to the cache
        if: github.event_name != 'pull_request'
        env:
          NIKS3_AUTH_TOKEN_FILE: "/tmp/niks3-token"
          NIKS3_SERVER_URL: ${{ vars.NIKS3_SERVER_URL }}
        run: |
          echo ${{ secrets.NIKS3_AUTH_TOKEN }} > $NIKS3_AUTH_TOKEN_FILE
          xargs niks3 push < "$RUNNER_TEMP/kernel"

      - name: Build the system
        run: |
          nix build --cores 2 --no-link --print-out-paths \
            .#nixosConfigurations.blueos-${{ matrix.board }}.config.system.build.toplevel \
            > "$RUNNER_TEMP/toplevel"

      - name: Push the system to the cache
        if: github.event_name != 'pull_request'
        env:
          NIKS3_AUTH_TOKEN_FILE: "/tmp/niks3-token"
          NIKS3_SERVER_URL: ${{ vars.NIKS3_SERVER_URL }}
        run: |
          echo ${{ secrets.NIKS3_AUTH_TOKEN }} > $NIKS3_AUTH_TOKEN_FILE
          niks3 push "$(cat "$RUNNER_TEMP/toplevel")"

      - name: Pin system release in cache
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NIKS3_AUTH_TOKEN_FILE: "/tmp/niks3-token"
          NIKS3_SERVER_URL: ${{ vars.NIKS3_SERVER_URL }}
        run: |
          echo ${{ secrets.NIKS3_AUTH_TOKEN }} > $NIKS3_AUTH_TOKEN_FILE
          niks3 pins create "blueos-${{ github.ref_name }}" "$(cat "$RUNNER_TEMP/toplevel")"

      - name: Collect the release metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          toplevel="$(cat "$RUNNER_TEMP/toplevel")"
          case "$toplevel" in
            /nix/store/*) ;;
            *) echo "'$toplevel' is not a store path." >&2; exit 1 ;;
          esac

          # Read from the option rather than the matrix, because this is the
          # value the daemon filters releases by. Selecting the fields instead
          # of copying the file keeps anything else the closure records out of
          # the published contract.
          board="$(nix eval --raw \
            ".#nixosConfigurations.blueos-${{ matrix.board }}.config.services.blueos.board")"
          jq --arg board "$board" --arg toplevel "$toplevel" \
            '{board: $board, channel, version, revision, toplevel: $toplevel}' \
            "$toplevel/etc/blueos/release.json" > "$RUNNER_TEMP/release.json"
          cat "$RUNNER_TEMP/release.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-${{ matrix.board }}
          path: ${{ runner.temp }}/release.json
          if-no-files-found: error
          retention-days: 1

      - name: Build the SD card image
        run: |
          nix build .#nixosConfigurations.blueos-${{ matrix.board }}.config.system.build.sdImage \
            --out-link image

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blueos-${{ matrix.board }}
          path: image/sd-image/*.img.zst
          if-no-files-found: error
          retention-days: 7

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: image/sd-image/*.img.zst

  # Cache the system closure (QEMU image requires KVM)
  qemu-system:
    name: Cache the QEMU guest system (${{ matrix.guest }})
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        guest: [guest, native]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space
        uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          add-channel: "true"
          extra-conf: |
            accept-flake-config = true
            extra-substituters = ${{ vars.NIKS3_SERVER_URL }}
            extra-trusted-public-keys = ${{ vars.NIKS3_PUBLIC_KEY }}
            max-jobs = 1

      - name: Install niks3
        run: nix profile install nixpkgs#niks3

      - name: Build the system
        run: |
          nix build --no-link --print-out-paths \
            ".#nixosConfigurations.blueos-${{ matrix.guest }}.config.system.build.toplevel" \
            > "$RUNNER_TEMP/toplevel"

      - name: Push the system to the cache
        if: github.event_name != 'pull_request'
        env:
          NIKS3_AUTH_TOKEN_FILE: "/tmp/niks3-token"
          NIKS3_SERVER_URL: ${{ vars.NIKS3_SERVER_URL }}
        run: |
          echo ${{ secrets.NIKS3_AUTH_TOKEN }} > $NIKS3_AUTH_TOKEN_FILE
          niks3 push "$(cat "$RUNNER_TEMP/toplevel")"
          niks3 pins create "blueos-${{ matrix.guest }}-system" "$(cat "$RUNNER_TEMP/toplevel")"

      - name: Build the QEMU image
        run: |
          nix build .#blueos-${{ matrix.guest }}-qemu --out-link vm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blueos-qemu-${{ matrix.guest }}
          path: vm/*.qcow2
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release manifest
    needs: image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    concurrency:
      group: manifest-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          path: ${{ runner.temp }}/releases

      - name: Merge into the published manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          sources=("$RUNNER_TEMP"/releases/*/release.json)
          shopt -u nullglob
          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No release metadata was produced." >&2
            exit 1
          fi

          work="$RUNNER_TEMP/manifest"
          git init --quiet "$work"
          git -C "$work" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C "$work" fetch --quiet --depth=1 origin gh-pages 2>/dev/null; then
            git -C "$work" checkout --quiet -B gh-pages FETCH_HEAD
          else
            # First publish. An orphan branch keeps this history free of the
            # source tree, since the file is the only thing the branch holds.
            git -C "$work" checkout --quiet --orphan gh-pages
          fi

          manifest="$work/manifest.json"
          previous='[]'
          if [ -f "$manifest" ]; then
            previous="$(jq -c '.releases // []' "$manifest")"
          fi

          # A re-run of an old tag is a rebuild of that version, so it takes the
          # place of the entry it replaces rather than appearing beside it. When
          # the build is byte-for-byte the one already listed, its original
          # `published` is kept so re-running a tag changes nothing.
          published="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          entries="$(jq -s -c --arg published "$published" \
            'map(. + {published: $published})' "${sources[@]}")"

          jq -S -n --argjson previous "$previous" --argjson entries "$entries" '
            ($previous + $entries)
            | group_by([.board, .version])
            | map(
                max_by(.published // "") as $newest
                | ($previous
                   | map(select(.board == $newest.board
                                and .version == $newest.version
                                and .toplevel == $newest.toplevel))
                   | first) as $existing
                | if $existing then $existing else $newest end
              )
            | sort_by(.published // "")
            | reverse
            | {releases: .}
          ' > "$manifest"
          cat "$manifest"

          # GitHub Pages serves index.html at the site root, so a bare
          # /manifest.json would 404 even though the file is there.
          cat > "$work/index.html" <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>blueos-nix releases</title>
          <p>Release manifest: <a href="manifest.json">manifest.json</a></p>
          HTML

          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" add manifest.json index.html
          if git -C "$work" diff --cached --quiet; then
            echo "The manifest already lists these builds."
            exit 0
          fi
          git -C "$work" commit --quiet --message "Publish ${GITHUB_REF_NAME}"
          git -C "$work" push --quiet origin gh-pages
