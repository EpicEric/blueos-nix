name: Build RPi images with Nix

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: ${{ matrix.board }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        board: [pi4, pi5]
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          add-channel: "true"
          extra-conf: |
            accept-flake-config = true
            extra-substituters = ${{ vars.NIKS3_SERVER_URL }}
            extra-trusted-public-keys = ${{ vars.NIKS3_PUBLIC_KEY }}
            # Prevent out-of-memory SIGTERM
            max-jobs = 1

      - name: Install niks3
        run: nix profile install nixpkgs#niks3

      - name: Build the kernel
        run: |
          nix build --no-link --print-out-paths \
            .#nixosConfigurations.blueos-${{ matrix.board }}.config.boot.kernelPackages.kernel \
            .#nixosConfigurations.blueos-${{ matrix.board }}.config.boot.kernelPackages.kernel.modules \
            > "$RUNNER_TEMP/kernel"

      - name: Push the kernel to the cache
        if: github.event_name != 'pull_request'
        env:
          NIKS3_AUTH_TOKEN_FILE: "/tmp/niks3-token"
          NIKS3_SERVER_URL: ${{ vars.NIKS3_SERVER_URL }}
        run: |
          echo ${{ secrets.NIKS3_AUTH_TOKEN }} > $NIKS3_AUTH_TOKEN_FILE
          xargs niks3 push < "$RUNNER_TEMP/kernel"

      - name: Build the system
        run: |
          nix build --cores 2 --no-link --print-out-paths \
            .#nixosConfigurations.blueos-${{ matrix.board }}.config.system.build.toplevel \
            > "$RUNNER_TEMP/toplevel"

      - name: Push the system to the cache
        if: github.event_name != 'pull_request'
        env:
          NIKS3_AUTH_TOKEN_FILE: "/tmp/niks3-token"
          NIKS3_SERVER_URL: ${{ vars.NIKS3_SERVER_URL }}
        run: |
          echo ${{ secrets.NIKS3_AUTH_TOKEN }} > $NIKS3_AUTH_TOKEN_FILE
          niks3 push "$(cat "$RUNNER_TEMP/toplevel")"

      - name: Build the SD card image
        run: |
          nix build .#nixosConfigurations.blueos-${{ matrix.board }}.config.system.build.sdImage \
            --out-link image

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blueos-${{ matrix.board }}
          path: image/sd-image/*.img.zst
          if-no-files-found: error
          retention-days: 7

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: image/sd-image/*.img.zst
